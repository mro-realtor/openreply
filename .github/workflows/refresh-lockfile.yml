name: Refresh lockfile (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/api-mcp'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Update lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify npm ci works with the new lockfile
        run: npm ci --ignore-scripts --dry-run
      - name: Commit lockfile
        run: |
          if git diff --quiet package-lock.json; then echo "lockfile already current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update package-lock.json for MCP SDK dependency"
          git push origin HEAD:feature/api-mcp
